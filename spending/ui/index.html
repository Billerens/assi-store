<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Траты</title>
<link rel="stylesheet" href="/ui/kit/kit.css">
<style>
  .page {
    max-width: 880px;
  }

  .cols {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
    gap: 16px;
    align-items: start;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }

  .month {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .month h2 {
    flex: 1;
    text-align: center;
  }

  .big {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .meter {
    height: 8px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .meter > div {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
  }

  .meter.over > div {
    background: var(--danger);
  }

  .meter.thin {
    height: 4px;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    color: var(--ink-2);
    font-size: 14px;
  }

  .stats b {
    color: var(--ink);
    font-weight: 600;
  }

  /* Rows of every list here: the name keeps its longest word, and a sum, a date or a button
     that does not fit beside it goes to a second line instead of squeezing the name. */
  .list > * {
    flex-wrap: wrap;
    gap: 4px 12px;
  }

  .list > * > .grow,
  .op .what,
  .sub-row .what {
    flex: 1 1 7em;
    min-width: auto;
    max-width: 100%;
  }

  .list > * > .grow ~ :last-child,
  .list > * > .what ~ :last-child {
    margin-left: auto;
  }

  /* A choice and its buttons stay together when they go under the name. */
  .list > * > .acts {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
    max-width: 100%;
  }

  .budget-top {
    flex-wrap: wrap;
    gap: 2px 10px;
  }

  .budget-top .big {
    flex: 1 1 auto;
    min-width: auto;
    max-width: 100%;
  }

  .cat {
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: stretch !important;
    gap: 6px !important;
  }

  .cat .top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
  }

  .cat .name {
    flex: 1 1 6em;
    min-width: auto;
    max-width: 100%;
  }

  .cat .sum,
  .sub-row .sum {
    white-space: nowrap;
  }

  .cat .share {
    color: var(--ink-3);
    font-size: 13px;
    min-width: 36px;
    text-align: right;
    white-space: nowrap;
  }

  .chart {
    position: relative;
    touch-action: pan-y;
  }

  .chart svg {
    display: block;
    width: 100%;
    overflow: visible;
  }

  .chart .bar {
    fill: var(--accent);
  }

  .chart .bar.today {
    fill: var(--ink);
  }

  .chart .bar.picked {
    fill: var(--ink);
  }

  .chart .pace {
    stroke: var(--ink-3);
    stroke-width: 1.5;
    stroke-dasharray: 4 4;
  }

  .chart .axis {
    stroke: var(--line);
    stroke-width: 1;
  }

  .chart text {
    fill: var(--ink-3);
    font-size: 11px;
  }

  .tip {
    position: absolute;
    top: 0;
    transform: translate(-50%, -110%);
    padding: 6px 10px;
    border-radius: var(--radius-s);
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 13px;
    white-space: nowrap;
    pointer-events: none;
  }

  .legend {
    display: flex;
    gap: 16px;
    color: var(--ink-3);
    font-size: 12px;
  }

  .legend .dash {
    display: inline-block;
    width: 16px;
    border-top: 1.5px dashed var(--ink-3);
    vertical-align: middle;
    margin-right: 6px;
  }

  .op .what {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .op .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    color: var(--ink-2);
    font-size: 12px;
  }

  .op .sum {
    max-width: 100%;
    font-weight: 600;
    white-space: nowrap;
    text-align: right;
  }

  .op .sum.plus {
    color: var(--ok);
  }

  .op.grey .name, .op.grey .sum {
    color: var(--ink-3);
  }

  .op.grey .sum {
    text-decoration: line-through;
  }

  .op .src {
    color: var(--ink-3);
    flex: none;
  }

  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 12px;
  }

  .day-head {
    display: flex;
    justify-content: space-between;
    color: var(--ink-2);
    font-size: 13px;
    padding: 0 4px;
  }

  .search {
    position: relative;
    flex: 1;
    min-width: 0;
  }

  .search .input {
    padding-left: 40px;
  }

  .search svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-3);
    pointer-events: none;
  }

  .scroll-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: 0 -16px;
    padding: 0 16px;
  }

  .scroll-chips::-webkit-scrollbar {
    display: none;
  }

  .scroll-chips .chip {
    flex: none;
  }

  .pair {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .raw-text {
    padding: 10px 12px;
    border-radius: var(--radius-s);
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.4;
    word-break: break-word;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px 16px;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
  }

  .toggle span {
    flex: 1;
  }

  details > summary {
    min-height: 44px;
    display: flex;
    align-items: center;
    color: var(--ink-2);
    cursor: pointer;
  }

  .lines {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0;
    padding-left: 18px;
  }

  .sheet h3 {
    margin-bottom: 4px;
  }

  .sheet .field + .field, .sheet .field + .toggle, .sheet .toggle + .field {
    margin-top: 10px;
  }

  .note {
    color: var(--ink-3);
    font-size: 12px;
  }

  @media (max-width: 360px) {
    .big {
      font-size: 22px;
    }
  }
</style>
<body>
<main class="page">
  <header class="topbar">
    <button class="icon-btn" onclick="assi.back()" aria-label="Назад" data-icon="back"></button>
    <h1>Траты</h1>
    <button class="icon-btn" id="add" aria-label="Добавить вручную" data-icon="plus"></button>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="tab" data-tab="overview" id="overview"></div>
  <div class="tab" data-tab="feed">
    <div class="row">
      <label class="search">
        <span data-icon="search"></span>
        <input class="input" id="q" type="search" placeholder="Магазин, категория, сумма" autocomplete="off">
      </label>
      <button class="icon-btn" id="add2" aria-label="Добавить вручную" data-icon="plus"></button>
    </div>
    <div class="scroll-chips" id="cats"></div>
    <div class="section" id="feed"></div>
  </div>
  <div class="tab" data-tab="subs" id="subs"></div>
  <div class="tab" data-tab="sources" id="sources"></div>
  <div class="tab" data-tab="settings" id="settings"></div>
</main>
<script src="/ui/kit/kit.js"></script>
<script>
  // Траты: the screen of modules/spending. Everything comes from main.js through assi.call.
  const h = ui.h;
  const MAIN = 'modules/spending/main.js';
  const call = (fn, ...args) => assi.call(MAIN, fn, ...args);
  const params = new URLSearchParams(location.search);
  const SIGNS = { RUB: '₽', USD: '$', EUR: '€', GBP: '£', CNY: '¥', KZT: '₸', TRY: '₺' };
  const MONTHS_OF = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const PERIOD = { week: 'в неделю', month: 'в месяц', year: 'в год' };
  const PERIOD_ONCE = { week: 'раз в неделю', month: 'раз в месяц', year: 'раз в год' };
  const SOURCE_ICON = { push: 'bell', wallet: 'wallet', sms: 'message', import: 'message', manual: 'edit' };
  const SOURCE_NAME = { push: 'пуш', wallet: 'кошелёк', sms: 'SMS', import: 'SMS из истории', manual: 'вручную' };
  const PLUS = { refund: 1, income: 1, transfer_in: 1, cashback: 1 };
  const TYPE_NAME = {
    purchase: 'Покупка', hold: 'Холд', fee: 'Комиссия', refund: 'Возврат', transfer_out: 'Перевод', transfer_in: 'Входящий перевод',
    income: 'Поступление', cashback: 'Кешбэк', declined: 'Отказ'
  };

  let state = { offset: 0, category: null, query: '', limit: 60, tab: 'overview', categories: [], currency: 'RUB' };

  function money(value, cur, kopecks) {
    if (value === null || value === undefined || isNaN(value)) return '—';
    const abs = Math.abs(Number(value));
    const cents = Math.round(abs * 100) % 100;
    const whole = Math.floor(Math.round(abs * 100) / 100);
    const grouped = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const tail = cents && kopecks !== false ? ',' + String(cents).padStart(2, '0') : '';
    const sign = Number(value) < 0 ? '−' : '';
    const mark = cur === false ? '' : SIGNS[cur || state.currency] || (cur || state.currency);
    return sign + grouped + tail + (mark ? ' ' + mark : '');
  }

  function dateText(time) {
    const d = new Date(time);
    return d.getDate() + ' ' + MONTHS_OF[d.getMonth()];
  }

  function clock(time) {
    const d = new Date(time);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100;
    const b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function fail(error) {
    ui.toast(String(error && error.message || error).replace(/^Ошибка: /, ''));
  }

  function card(cls, ...children) {
    return h('div', { class: 'card ' + (cls || '') }, ...children);
  }

  function pendingRatesNote(count) {
    const n = Math.max(0, Number(count) || 0);
    return n ? h('p', { class: 'note', role: 'status', 'data-pending-rates': '' },
      'Ждут курса: ' + n + ' ' + plural(n, 'операция', 'операции', 'операций') + '. Пока они не входят в итог.') : null;
  }

  function spinnerButton(button, work) {
    return async () => {
      const text = button.textContent;
      button.disabled = true;
      button.replaceChildren(h('span', { class: 'spinner' }), text);
      try {
        await work();
      } catch (error) {
        fail(error);
      } finally {
        button.disabled = false;
        button.textContent = text;
      }
    };
  }

  // ---- Обзор ---------------------------------------------------------------------------------

  function budgetCard(o) {
    const s = o.summary;
    const warn = (o.thresholds && o.thresholds[0]) || 80;
    if (!s.budget) {
      return card('', h('div', { class: 'section' },
        h('div', { class: 'muted small' }, 'Потрачено'),
        h('div', { class: 'big' }, money(s.spent, o.currency, false)),
        h('p', { class: 'muted small' }, 'Бюджет месяца не задан — задайте его, и здесь будет остаток и сколько можно тратить в день.'),
        h('button', { class: 'btn soft', onclick: () => budgetSheet(o) }, 'Задать бюджет')));
    }
    const pct = Math.max(0, Math.min(100, s.pct || 0));
    return h('button', { class: 'card', style: 'text-align: left; border: 0; width: 100%', onclick: () => budgetSheet(o), 'aria-label': 'Бюджет месяца' },
      h('div', { class: 'section' },
        h('div', { class: 'row budget-top' },
          h('div', { class: 'big grow' }, money(s.spent, o.currency, false)),
          h('div', { class: 'muted' }, 'из ' + money(s.budget, o.currency, false))),
        h('div', { class: 'meter' + ((s.pct || 0) >= warn ? ' over' : '') }, h('div', { style: 'width: ' + pct + '%' })),
        h('div', { class: 'stats' },
          s.left >= 0
            ? h('span', {}, 'Осталось ', h('b', {}, money(s.left, o.currency, false)))
            : h('span', {}, 'Перерасход ', h('b', { style: 'color: var(--danger)' }, money(-s.left, o.currency, false))),
          o.offset === 0 && s.daysLeft > 0 && h('span', {}, 'На день ', h('b', {}, money(s.perDay, o.currency, false))),
          o.offset === 0 && s.daysLeft > 0 && h('span', {}, s.daysLeft + ' ' + plural(s.daysLeft, 'день', 'дня', 'дней') + ' до конца'))));
  }

  function categoriesCard(o) {
    const list = o.summary.byCategory.filter(item => item.sum > 0);
    if (!list.length) return card('', h('div', { class: 'muted' }, 'Трат в этом месяце пока нет.'));
    return h('div', { class: 'section' },
      h('h2', {}, 'Категории'),
      h('div', { class: 'list' }, ...list.map(item => {
        const width = item.limit ? Math.min(100, item.sum / item.limit * 100) : Math.round(item.share * 100);
        return h('button', { class: 'cat', onclick: () => openFeed(item.name) },
          h('div', { class: 'top' },
            h('span', { class: 'name', 'data-raw': '' }, item.name),
            h('span', { class: 'sum' }, money(item.sum, o.currency, false)),
            h('span', { class: 'share' }, item.limit ? 'из ' + money(item.limit, o.currency, false) : Math.round(item.share * 100) + '%')),
          h('div', { class: 'meter thin' + (item.limit && item.sum >= item.limit ? ' over' : '') }, h('div', { style: 'width: ' + width + '%' })));
      })));
  }

  // Days of the month as bars, drawn by hand in SVG, with the even pace as a dashed line.
  function chartCard(o) {
    const box = h('div', { class: 'chart' });
    const legend = h('div', { class: 'legend' });
    const wrap = h('div', { class: 'section' }, h('h2', {}, 'По дням'), card('', box, legend));
    requestAnimationFrame(() => drawChart(box, legend, o));
    return wrap;
  }

  function drawChart(box, legend, o) {
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs) => {
      const node = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(key => node.setAttribute(key, attrs[key]));
      return node;
    };
    const days = o.summary.byDay;
    const n = days.length;
    const width = Math.max(240, box.clientWidth || 300);
    const height = 150;
    const top = 16;
    const bottom = 20;
    const plot = height - top - bottom;
    const pace = o.summary.pace;
    const max = Math.max(1, pace || 0, ...days);
    const step = width / n;
    const gap = Math.min(2, step * 0.3);
    const bar = Math.max(1, step - gap);
    const y = v => top + plot - Math.max(0, v) / max * plot;
    const start = new Date(o.period.start);
    const todayIndex = o.offset === 0 ? Math.floor((Date.now() - o.period.start) / 864e5) : -1;
    const svg = el('svg', { viewBox: '0 0 ' + width + ' ' + height, height: height, role: 'img', 'aria-label': 'Траты по дням месяца' });
    svg.appendChild(el('line', { class: 'axis', x1: 0, x2: width, y1: top + plot + 0.5, y2: top + plot + 0.5 }));
    const tip = h('div', { class: 'tip', hidden: true });
    const bars = [];
    days.forEach((value, i) => {
      const x = i * step + gap / 2;
      const yy = y(value);
      const hgt = top + plot - yy;
      const r = Math.min(4, bar / 2, hgt);
      if (hgt > 0.5) {
        // Rounded at the data end, square on the baseline.
        const d = 'M' + x + ',' + (top + plot) + 'V' + (yy + r) + 'Q' + x + ',' + yy + ' ' + (x + r) + ',' + yy +
          'H' + (x + bar - r) + 'Q' + (x + bar) + ',' + yy + ' ' + (x + bar) + ',' + (yy + r) + 'V' + (top + plot) + 'Z';
        const path = el('path', { class: 'bar' + (i === todayIndex ? ' today' : ''), d: d });
        svg.appendChild(path);
        bars[i] = path;
      }
      const day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const label = day.getDate();
      if (i === 0 || i === n - 1 || label % 5 === 0 && i < n - 2 && i > 1) {
        const t = el('text', { x: x + bar / 2, y: height - 4, 'text-anchor': 'middle' });
        t.textContent = label;
        svg.appendChild(t);
      }
      // A hit area as wide as the day's column and as tall as the plot.
      const hit = el('rect', { x: i * step, y: 0, width: step, height: top + plot, fill: 'transparent' });
      hit.addEventListener('click', () => {
        bars.forEach(b => b && b.classList.remove('picked'));
        if (bars[i]) bars[i].classList.add('picked');
        tip.hidden = false;
        tip.textContent = day.getDate() + ' ' + MONTHS_OF[day.getMonth()] + ': ' + money(value, o.currency, false);
        // The note is centred on its bar but never leaves the chart, however long the sum is.
        const half = Math.max(60, tip.offsetWidth / 2);
        tip.style.left = Math.max(half, Math.min(width - half, x + bar / 2)) + 'px';
        tip.style.top = Math.max(16, yy) + 'px';
      });
      svg.appendChild(hit);
    });
    if (pace) {
      svg.appendChild(el('line', { class: 'pace', x1: 0, x2: width, y1: y(pace), y2: y(pace) }));
    }
    const peak = el('text', { x: 0, y: 10 });
    peak.textContent = money(max, o.currency, false);
    svg.appendChild(peak);
    box.replaceChildren(svg, tip);
    legend.replaceChildren(
      pace ? h('span', {}, h('span', { class: 'dash' }), 'ровный темп — ' + money(pace, o.currency, false) + ' в день') : h('span', {}, 'Нажмите на столбик — сумма за день'));
  }

  function upcomingCard(o) {
    return h('div', { class: 'section' },
      h('h2', {}, 'Скоро спишут'),
      o.upcoming.length
        ? h('div', { class: 'list' }, ...o.upcoming.map(sub => h('button', { onclick: () => showTab('subs') },
          h('span', { 'data-icon': 'calendar', class: 'src' }),
          h('span', { class: 'grow', 'data-raw': '' }, sub.merchant),
          h('span', { class: 'muted small' }, dateText(sub.next)),
          h('span', { class: 'sum' }, money(sub.amount, sub.currency)))))
        : card('', h('div', { class: 'muted small' }, 'Подтверждённых подписок нет. Модуль ищет их сам — загляните во вкладку «Подписки».')));
  }

  function reviewCard(review) {
    if (!review) return null;
    return h('div', { class: 'section' },
      h('h2', {}, 'Разбор: ' + review.label.toLowerCase()),
      card('', h('ul', { class: 'lines', 'data-raw': '' }, ...review.lines.map(line => h('li', {}, line))),
        review.sleep && h('p', { class: 'small muted', style: 'margin-top: 10px', 'data-raw': '' }, review.sleep),
        h('p', { class: 'note', style: 'margin-top: 8px' }, review.via === 'code' ? 'Посчитано кодом, без модели. Это наблюдения, а не советы.' : 'Цифры посчитаны кодом, слова — моделью. Это наблюдения, а не советы.')));
  }

  function importCard(o) {
    if (o.imported || o.importDays <= 0) return null;
    const button = h('button', { class: 'btn primary' }, 'Импортировать');
    button.onclick = spinnerButton(button, async () => {
      const out = await call('importSms');
      if (out.error) { ui.toast(out.error); return; }
      ui.toast('Найдено ' + out.added + ' операций в ' + out.seen + ' SMS банков');
      render();
    });
    return card('accent', h('div', { class: 'section' },
      h('div', { style: 'font-weight: 600' }, 'История SMS банков'),
      h('p', { class: 'small muted' }, 'Импорт SMS за ' + o.importDays + ' дней — чтобы бюджет и подписки работали с первого дня. Читаются только отправители из списка банков; коды подтверждения не сохраняются.'),
      h('div', {}, button)));
  }

  async function renderOverview() {
    const o = await call('overview', state.offset);
    o.offset = state.offset;
    state.currency = o.currency;
    const box = document.getElementById('overview');
    const head = h('div', { class: 'month' },
      h('button', { class: 'icon-btn', 'aria-label': 'Прошлый месяц', onclick: () => { state.offset++; renderOverview(); } }, ui.icon('back')),
      h('h2', {}, o.period.label + ' ' + o.period.year),
      h('button', { class: 'icon-btn', 'aria-label': 'Следующий месяц', disabled: state.offset === 0, style: state.offset === 0 ? 'opacity: .3' : '',
        onclick: () => { if (state.offset > 0) { state.offset--; renderOverview(); } } }, ui.icon('right')));
    const recent = o.recent.length
      ? h('div', { class: 'section' }, h('h2', {}, 'Последние операции'), h('div', { class: 'list' }, ...o.recent.map(opRow)),
        h('button', { class: 'btn', onclick: () => showTab('feed') }, 'Вся лента'))

  // ---- Лента ---------------------------------------------------------------------------------

  function opRow(tx) {
    const grey = tx.internal || tx.excluded || tx.type === 'declined';
    const plus = PLUS[tx.type];
    const notes = [];
    if (tx.internal) notes.push('перевод себе');
    if (tx.excluded) notes.push('не трата');
    if (tx.type === 'declined') notes.push('отказ');
    if (tx.type === 'hold') notes.push('холд');
    if (tx.type === 'refund') notes.push('возврат');
    if (tx.dupOf) notes.push('повтор');
    if (tx.fx === 'cbr') notes.push('по курсу ЦБ');
    if (tx.fx === 'pending') notes.push('ждёт курса');
    if (tx.currencyKnown === false) notes.push('валюта не указана');
    return h('button', { class: 'op' + (grey ? ' grey' : ''), onclick: () => openTx(tx.id) },
      h('span', { class: 'src', 'data-icon': SOURCE_ICON[tx.source] || 'bell', title: SOURCE_NAME[tx.source] || '' }),
      h('span', { class: 'what' },
        h('span', { class: 'name', 'data-raw': '' }, tx.name),
        h('span', { class: 'meta' },
          tx.category && h('span', { class: 'tag', 'data-raw': '' }, tx.category),
          tx.card && h('span', {}, '•' + tx.card),
          h('span', {}, clock(tx.at)),
          notes.length > 0 && h('span', {}, notes.join(', ')))),
      h('span', { class: 'sum' + (plus && !grey ? ' plus' : '') },
        (plus ? '+' : '') + money(tx.amount, tx.currencyKnown === false ? false : tx.currency),
        tx.currency !== state.currency && tx.amountBase !== null && tx.fx !== 'pending' && h('div', { class: 'small muted' }, money(tx.amountBase, state.currency))));
  }

  async function renderFeed() {
    const out = await call('feed', { query: state.query, category: state.category, limit: state.limit });

        onclick: () => { state.category = state.category === name ? null : name; renderFeed(); } }, name)));

  async function openTx(id) {

        (TYPE_NAME[tx.type] || tx.type) + ' · ' + dateText(tx.at) + ', ' + clock(tx.at) + ' · ' + (SOURCE_NAME[tx.source] || tx.source) +
        (tx.bank ? ' · ' + tx.bank : '') + (tx.card ? ' · карта •' + tx.card : '') + (tx.balance !== null && tx.balance !== undefined ? ' · остаток ' + money(tx.balance, 'RUB') : '')),
      tx.currency !== state.currency && tx.amountBase !== null && tx.fx !== 'pending' && h('p', { class: 'small muted' }, 'В валюте бюджета: ' + money(tx.amountBase) + (tx.fx === 'cbr' ? ' по курсу ЦБ — заменится, когда банк спишет окончательную сумму' : '')),

        h('div', { class: 'actions' }, h('button', { class: 'btn danger', onclick: async () => {

    const counts = ['purchase', 'hold', 'fee', 'refund', 'transfer_out'].indexOf(tx.type) >= 0;
    close = ui.sheet([...head,
      counts && h('label', { class: 'field', style: 'margin-top: 12px' }, h('span', {}, 'Категория'), category),

      h('label', { class: 'field' }, h('span', {}, 'Сумма, ' + (SIGNS[tx.currency] || tx.currency)), amount),
      tx.repeats.length ? h('div', { class: 'section', style: 'margin-top: 12px' },
        h('div', { class: 'small muted' }, 'Склеено как одна операция — пришло ещё из:'),
        h('div', { class: 'list' }, ...tx.repeats.map(rep => h('div', {},
          h('span', { class: 'src', 'data-icon': SOURCE_ICON[rep.source] || 'bell' }),
          h('span', { class: 'grow small', 'data-raw': '' }, (rep.sender || '') + ' · ' + clock(rep.at)),
          h('button', { class: 'btn small', onclick: async () => { await call('split', rep.id).catch(fail); done(); } }, 'Это отдельная покупка'))))) : null,
      tx.repeatOf && h('p', { class: 'small muted' }, 'Это повтор операции «' + tx.repeatOf.name + '» — в суммах не участвует.',
        h('button', { class: 'btn small', style: 'margin-left: 8px', onclick: async () => { await call('split', tx.id).catch(fail); done(); } }, 'Разделить')),
      h('div', { class: 'pair', style: 'margin-top: 12px' },
        counts && h('button', { class: 'btn soft small', onclick: async () => { await call('setExcluded', tx.id, !tx.excluded).catch(fail); done(); } },
          tx.excluded ? 'Это трата' : 'Это не трата'),
        h('button', { class: 'btn soft small', onclick: async () => { await call('setInternal', tx.id, !tx.internal).catch(fail); done(); } },
          tx.internal ? 'Это не перевод себе' : 'Это перевод себе')),
      h('div', { class: 'actions' },
        h('button', { class: 'btn danger', onclick: async () => {
          if (!(await ui.confirm('Удалить операцию? Она пропадёт и из общей базы.', 'Удалить', true))) return;
          await call('remove', tx.id).catch(fail);

        : card('', h('div', { class: 'small muted' }, 'За 30 дней распознанных трат нет. Проверьте, что у Assi есть доступ к уведомлениям, а приложение банка — в списке во вкладке «Настройки».'))));
    if (src.suggested.length) {
      parts.push(h('div', { class: 'section' }, h('h2', {}, 'Похоже на банк'),
        h('p', { class: 'small muted' }, 'Эти приложения и отправители присылали уведомления с суммой и словом операции, но их нет в списке. Текст не сохранялся — только счёт.'),
        h('div', { class: 'list' }, ...src.suggested.map(item => h('div', {},
          h('span', { class: 'src', 'data-icon': item.kind === 'sms' ? 'message' : 'bell' }),
          h('span', { class: 'grow' }, h('div', { 'data-raw': '' }, item.app), h('div', { class: 'small muted', 'data-raw': '' }, item.id + ' · ' + item.count + ' ' + plural(item.count, 'раз', 'раза', 'раз'))),
          h('span', { class: 'acts' },
            h('button', { class: 'btn small primary', onclick: async () => { await call('setSource', item.kind === 'sms' ? 'sms' : 'app', item.id, true).catch(fail); renderSources(); } }, 'Читать'),
            h('button', { class: 'icon-btn', 'aria-label': 'Скрыть', onclick: async () => { await call('ignoreSuggestion', item.kind, item.id).catch(fail); renderSources(); } }, ui.icon('close'))))))));
    }
    const again = h('button', { class: 'btn small' }, 'Разобрать заново');
    again.onclick = spinnerButton(again, async () => {
      const out = await call('reparse');
      ui.toast('Разобрано: ' + out.ok + ', осталось: ' + out.still);
      renderSources();
    });
    parts.push(h('div', { class: 'section' },
      h('div', { class: 'row' }, h('h2', { class: 'grow' }, 'Не разобрано'), src.unparsed.length ? again : null),
      src.unparsed.length
        ? h('div', { class: 'section' }, ...src.unparsed.map(item => card('', h('div', { class: 'section' },
          h('div', { class: 'small muted', 'data-raw': '' }, (item.app || item.sender || '') + ' · ' + dateText(item.at) + ', ' + clock(item.at)),
          h('div', { class: 'raw-text', 'data-raw': '' }, item.text),
          h('div', { class: 'pair' },
            h('button', { class: 'btn small soft', onclick: async () => askAgent(await call('unparsedItem', item.id)) }, 'Разобрать'),
            src.modelParse && h('button', { class: 'btn small', onclick: async () => {
              const out = await call('modelUnparsed', item.id).catch(fail);
              ui.toast(out && out.status === 'ok' ? 'Модель разобрала' : out && out.status === 'skip' ? 'Модель: это не операция' : 'Модель не справилась — ответ не сошёлся с текстом');
              renderSources();
            } }, 'Моделью'),
            h('button', { class: 'btn small', onclick: async () => { await call('dropUnparsed', item.id).catch(fail); renderSources(); } }, 'Убрать'))))))
        : card('', h('div', { class: 'small muted' }, 'Всё, что прислали банки, разобрано.' +
          (src.parseNew === 'off' ? ' Незнакомые форматы модель не разбирает (настройка).' : src.modelParse ? ' Незнакомые форматы разбирает модель на телефоне.' : '')))));
    box.replaceChildren(...parts);
    ui.icons(box);
  }

  // ---- Настройки -----------------------------------------------------------------------------

  const NUMBER_FIELDS = [
    ['monthStartDay', 'День начала месяца (1 или день зарплаты)'],
    ['dupWindowMin', 'Окно склейки повторов, минут'],
    ['subMinCount', 'Подписка: минимум списаний'],
    ['subDayTol', 'Подписка: допуск дня, ±дней'],
    ['subAmountTolPct', 'Подписка: допуск суммы, ±%'],
    ['subRemindDays', 'Напоминать о списании за, дней'],
    ['trialDays', 'Пробный период по умолчанию, дней'],
    ['unusualFactor', 'Необычная трата: во сколько раз больше медианы'],
    ['importDays', 'Импорт истории SMS, дней']
  ];
  const MORE_FIELDS = [
    ['holdDays', 'Холд и списание: дней между'],
    ['holdTolPct', 'Холд и списание: разница сумм, %'],
    ['fxDays', 'Покупка за границей и рублёвое списание: дней'],
    ['fxTolPct', 'Покупка за границей: разница с курсом ЦБ, %'],
    ['internalWindowMin', 'Перевод себе: окно, минут'],
    ['unusualMinSamples', 'Необычная трата: минимум покупок в категории'],
    ['unusualDays', 'Необычная трата: за сколько дней медиана'],
    ['ruleSamples', 'Образцов нового формата до правила'],
    ['categoryEveryMin', 'Раскладывать категории раз в, минут'],
    ['categoryBatch', 'Магазинов в одной просьбе к модели'],
    ['reviewMonths', 'Разбор: сравнивать со средним за, месяцев'],
    ['keepRawDays', 'Хранить исходный текст, дней'],
    ['unparsedKeep', 'Неразобранных хранить, штук'],
    ['unparsedDays', 'Неразобранных хранить, дней'],
    ['manualMatchMin', 'Трата из чата = операция банка в пределах, минут'],
    ['sleepThresholdMin', 'Короткая ночь: меньше, минут сна'],
    ['sleepMinDays', 'Связь со сном: минимум дней в группе'],
    ['sleepRatio', 'Связь со сном: разница больше, раз'],
    ['sleepDays', 'Связь со сном: за сколько дней'],
    ['overviewRecent', 'Последних операций в «Обзоре»'],
    ['widgetUpcoming', 'Подписок на виджете'],
    ['importLimit', 'Импорт: не больше SMS'],
    ['noDeliveryDays', 'Ачивка «Неделя без доставки»: дней без доставки еды'],
    ['noDeliveryBeforeDays', '…если до этого доставка была за последние, дней']
  ];
  const NOTIFY = [['budget', 'Бюджет перешёл порог'], ['unusual', 'Необычная трата'], ['subs', 'Скоро спишут по подписке'], ['trials', 'Кончается пробный период'], ['review', 'Месячный разбор']];

  let saveTimer = null;
  let pending = {};
  let saving = false;
  let savingCurrency = false;
  let currencyMessage = '';
  let reportedCurrency = null;
  let deferredRatesRefresh = false;

  function currentCurrencyText(currency, waiting) {
    return 'Валюта бюджета — ' + currency + '.' +
      (Number(waiting) > 0 ? ' Ждут курса: ' + Number(waiting) + '. Пока они не входят в итог.' : '');
  }

  function conversionText(report) {
    if (!report) return 'Валюта сохранена. Итоги обновлены.';
    const n = Math.max(0, Number(report.updated) || 0);
    const waiting = Math.max(0, Number(report.pending) || 0);
    return 'Валюта бюджета — ' + report.currency + '. Пересчитано операций: ' + n + '.' +
      (waiting ? ' Ждут курса: ' + waiting + '. Пока они не входят в итог.' : '');
  }

  function currencyStatus() {
    const busy = savingCurrency || Object.prototype.hasOwnProperty.call(pending, 'currency');
    const selector = document.getElementById('budgetCurrency');
    if (selector) selector.disabled = busy;
    const note = document.getElementById('currencyStatus');
    if (note) {
      note.textContent = busy ? 'Сохраняю валюту и пересчитываю операции…' : currencyMessage;
      note.hidden = !note.textContent;
    }
  }

  async function refreshCurrencyStatus() {
    const all = await call('settings');
    if (savingCurrency || Object.prototype.hasOwnProperty.call(pending, 'currency')) return;
    state.currency = all.settings.currency;
    reportedCurrency = state.currency;
    currencyMessage = currentCurrencyText(state.currency, all.pendingRates);
    document.querySelector('#settings [data-pending-rates]')?.remove();
    currencyStatus();
  }

  async function flushSettings() {
    saveTimer = null;
    if (saving || !Object.keys(pending).length) return;
    const send = pending;
    pending = {};
    saving = true;
    savingCurrency = Object.prototype.hasOwnProperty.call(send, 'currency');
    currencyStatus();
    try {
      const out = await call('saveSettings', send);
      if (out && out.settings) state.currency = out.settings.currency;
      if (savingCurrency) {
        reportedCurrency = state.currency;
        currencyMessage = conversionText(out && out.conversion);
        const selector = document.getElementById('budgetCurrency');
        if (selector) selector.value = state.currency;
        document.querySelector('#settings [data-pending-rates]')?.remove();
        // Refresh both cached views before the owner switches tabs; keep the form's other edits.
        const refreshed = await Promise.allSettled([renderOverview(), renderFeed()]);
        if (refreshed.some(result => result.status === 'rejected')) {
          currencyMessage += ' Не удалось обновить экран: откройте вкладку ещё раз.';
        }
        ui.toast(out && out.conversion ? 'Пересчитано операций: ' + (Number(out.conversion.updated) || 0) +
          (out.conversion.pending ? '. Ждут курса: ' + out.conversion.pending : '') : 'Валюта сохранена');
      } else ui.toast('Сохранено');
    } catch (error) {
      if (savingCurrency) {
        reportedCurrency = null;
        currencyMessage = 'Не удалось сохранить валюту. Попробуйте ещё раз.';
        const selector = document.getElementById('budgetCurrency');
        if (selector) selector.value = state.currency;
      }
      fail(error);
    } finally {
      saving = false;
      savingCurrency = false;
      currencyStatus();
      if (Object.keys(pending).length) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(flushSettings, 0);
      } else if (deferredRatesRefresh) {
        deferredRatesRefresh = false;
        if (state.tab === 'settings') refreshCurrencyStatus().catch(fail);
        else render();
      }
    }
  }

  function save(patch) {
    Object.assign(pending, patch);
    clearTimeout(saveTimer);
    clearTimeout(changedTimer);
    currencyStatus();
    saveTimer = setTimeout(flushSettings, 500);
  }

  function numberField(s, key, label) {
    const input = h('input', { class: 'input', inputMode: 'decimal', value: s[key] });
    input.onchange = () => {
      const value = Number(String(input.value).replace(',', '.'));
      if (isFinite(value)) save({ [key]: value });
    };
    return h('label', { class: 'field' }, h('span', {}, label), input);
  }

  function toggle(label, checked, onChange) {
    const input = h('input', { type: 'checkbox', class: 'switch', checked: Boolean(checked) });
    input.onchange = () => onChange(input.checked);
    return h('label', { class: 'toggle' }, h('span', {}, label), input);
  }

  function listField(s, key, label, hint) {
    const area = h('textarea', { class: 'input', rows: 5 });
    area.value = (s[key] || []).join('\n');
    area.onchange = () => save({ [key]: area.value.split('\n').map(x => x.trim()).filter(Boolean) });
    return h('label', { class: 'field' }, h('span', {}, label), area, hint && h('span', { class: 'note' }, hint));
  }

  function roleLine(name, model) {
    return h('div', {}, h('span', { class: 'grow' }, name), h('span', { class: 'small muted', 'data-raw': '' }, model ? (model.local ? 'на телефоне' : model.provider) + (model.model ? ' · ' + model.model : '') : 'не выбрана'));
  }

  async function renderSettings() {
    const all = await call('settings');
    const s = all.settings;
    state.currency = s.currency;
    if (reportedCurrency) {
      currencyMessage = reportedCurrency === s.currency ? currentCurrencyText(s.currency, all.pendingRates) : '';
      if (reportedCurrency !== s.currency) reportedCurrency = null;
    }
    const box = document.getElementById('settings');
    const budget = h('input', { class: 'input', inputMode: 'numeric', value: s.budget || '', placeholder: 'не задан' });
    budget.onchange = () => save({ budget: Number(String(budget.value).replace(/\s/g, '')) || null });
    const currency = h('select', { class: 'input', id: 'budgetCurrency' }, ...['RUB', 'USD', 'EUR', 'KZT', 'BYN', 'CNY', 'TRY', 'GEL', 'AMD'].map(c => h('option', { value: c, selected: s.currency === c }, c)));
    currency.onchange = () => save({ currency: currency.value });
    const thresholds = h('input', { class: 'input', value: s.thresholds.join(', ') });
    thresholds.onchange = () => save({ thresholds: thresholds.value.split(/[,;\s]+/).map(Number).filter(n => n > 0) });
    const parseNew = h('select', { class: 'input' },
      h('option', { value: 'local', selected: s.parseNew === 'local' }, 'Локальной моделью, если скачана'),
      h('option', { value: 'cloud', selected: s.parseNew === 'cloud' }, 'Любой моделью, и облачной'),
      h('option', { value: 'off', selected: s.parseNew === 'off' }, 'Не разбирать'));
    parseNew.onchange = () => save({ parseNew: parseNew.value });
    const reviewAt = h('input', { class: 'input', type: 'time', value: s.reviewAt });
    reviewAt.onchange = () => save({ reviewAt: reviewAt.value });
    const limits = s.categories.filter(name => name !== 'Переводы людям').map(name => {
      const input = h('input', { class: 'input', inputMode: 'numeric', value: s.categoryLimits[name] || '', placeholder: 'нет' });
      input.onchange = () => {
        const next = Object.assign({}, s.categoryLimits);
        const value = Number(String(input.value).replace(/\s/g, ''));
        if (value > 0) next[name] = value; else delete next[name];
        s.categoryLimits = next;
        save({ categoryLimits: next });
      };
      return h('label', { class: 'field' }, h('span', { 'data-raw': '' }, name), input);
    });
    const importNow = h('button', { class: 'btn small' }, 'Импортировать SMS сейчас');
    importNow.onclick = spinnerButton(importNow, async () => {
      const out = await call('importSms');
      ui.toast(out.error || ('Найдено ' + out.added + ' операций в ' + out.seen + ' SMS'));
    });
    const reviewNow = h('button', { class: 'btn small' }, 'Разобрать прошлый месяц');
    reviewNow.onclick = spinnerButton(reviewNow, async () => {
      await call('runReview', null, { quiet: true });
      state.offset = 0;
      showTab('overview');
    });
    const catsNow = h('button', { class: 'btn small' }, 'Разложить категории сейчас');
    catsNow.onclick = spinnerButton(catsNow, async () => {
      const out = await call('runCategories');
      ui.toast(out.status === 'ok' ? 'Разложено магазинов: ' + out.sorted : out.status === 'nothing' ? 'Все магазины уже в категориях' : out.status === 'no model' ? 'Модель не выбрана' : 'Не получилось: ' + (out.error || out.status));
    });
    const pin = h('button', { class: 'btn small', onclick: () => assi.native('shortcut.pin', 'Траты', 'modules/spending/ui/index.html').then(() => ui.toast('Ярлык добавлен')).catch(fail) }, 'Ярлык на рабочий стол');

    box.replaceChildren(
      h('div', { class: 'section' }, h('h2', {}, 'Бюджет'),
        h('div', { class: 'settings-grid' },
          h('label', { class: 'field' }, h('span', {}, 'Бюджет месяца'), budget),
          h('label', { class: 'field' }, h('span', {}, 'Валюта бюджета'), currency),
          h('label', { class: 'field' }, h('span', {}, 'Пороги предупреждения, %'), thresholds),
          numberField(s, 'monthStartDay', 'День начала месяца (1 или день зарплаты)')),
        h('p', { class: 'note', id: 'currencyStatus', role: 'status', 'aria-live': 'polite', hidden: true }),
        (s.budget || Object.keys(s.categoryLimits || {}).length || all.month && all.month.plan &&
          (all.month.plan.total || Object.keys(all.month.plan.limits || {}).length)) &&
          h('p', { class: 'note' }, 'При смене валюты числа бюджета и лимитов остаются прежними — теперь они заданы в выбранной валюте.'),
        !reportedCurrency && pendingRatesNote(all.pendingRates),
        toggle('Переводы людям входят в бюджет', s.transfersInBudget, on => save({ transfersInBudget: on }))),
      h('details', { class: 'section' }, h('summary', {}, 'Лимиты категорий'), h('div', { class: 'settings-grid' }, ...limits)),
      h('div', { class: 'section' }, h('h2', {}, 'Разбор и склейка'),
        h('label', { class: 'field' }, h('span', {}, 'Незнакомые форматы уведомлений разбирать'), parseNew),
        h('p', { class: 'note' }, 'В тексте уведомлений — суммы и остатки по счетам. Облачной модели они уходят, только если выбрано «Любой моделью».'),
        h('div', { class: 'settings-grid' }, ...NUMBER_FIELDS.filter(f => f[0] !== 'monthStartDay').map(f => numberField(s, f[0], f[1]))),
        toggle('Хранить исходный текст уведомлений', s.keepRaw, on => save({ keepRaw: on })),
        toggle('Раскладывать новые магазины по категориям моделью', s.categoryModel, on => save({ categoryModel: on })),
        toggle('Месячный разбор словами модели (ей уходят только цифры)', s.reviewModel, on => save({ reviewModel: on }))),
      h('div', { class: 'section' }, h('h2', {}, 'Уведомления'),
        ...NOTIFY.map(item => toggle(item[1], s.notify[item[0]], on => save({ notify: Object.assign({}, s.notify, { [item[0]]: on }) }))),
        h('label', { class: 'field' }, h('span', {}, 'Время напоминаний и месячного разбора'), reviewAt)),
      h('div', { class: 'section' }, h('h2', {}, 'Категории и источники'),
        listField(s, 'categories', 'Категории — по одной в строке'),
        listField(s, 'packages', 'Приложения банков (пакеты; * в конце — все, что так начинаются)', 'Начальный список — по известным пакетам; проверьте на телефоне, какие банки реально присылают уведомления (вкладка «Источники»).'),
        listField(s, 'wallets', 'Кошельки'),
        listField(s, 'smsSenders', 'Отправители SMS банков')),
      h('details', { class: 'section' }, h('summary', {}, 'Ещё числа'), h('div', { class: 'settings-grid' }, ...MORE_FIELDS.map(f => numberField(s, f[0], f[1])))),
      h('div', { class: 'section' }, h('h2', {}, 'Состояние'),
        h('div', { class: 'list' },
          h('div', {}, h('span', { class: 'grow' }, 'Чтение SMS'), h('span', { class: 'small muted' }, all.smsPermission ? 'разрешено' : 'не разрешено')),
          h('div', {}, h('span', { class: 'grow' }, 'Доступ к истории использования'), h('span', { class: 'small muted' }, all.usageAccess ? 'есть' : 'нет — в напоминаниях не будет, сколько раз открывали приложение')),
          h('div', {}, h('span', { class: 'grow' }, 'Импорт истории'), h('span', { class: 'small muted' }, all.state.imported ? dateText(all.state.imported) : 'ещё не было')),
          roleLine('Разбор форматов (spending.parse)', all.models.parse),
          roleLine('Правила (spending.rules)', all.models.rules),
          roleLine('Категории (spending.category)', all.models.category),
          roleLine('Разбор месяца (spending.review)', all.models.review))),
      h('div', { class: 'pair' }, importNow, catsNow, reviewNow, pin));
    ui.icons(box);
    currencyStatus();
  }

  // ---- tabs and events -----------------------------------------------------------------------

  const RENDER = { overview: renderOverview, feed: renderFeed, subs: renderSubs, sources: renderSources, settings: renderSettings };

  function render() {
    const fn = RENDER[state.tab];
    if (fn) fn().catch(fail);
  }

  const showTab = ui.tabs(document.getElementById('tabs'),
    [['overview', 'Обзор'], ['feed', 'Лента'], ['subs', 'Подписки'], ['sources', 'Источники'], ['settings', 'Настройки']],
    id => { state.tab = id; render(); });

  let searchTimer = null;
  document.getElementById('q').addEventListener('input', event => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.query = event.target.value.trim(); state.limit = 60; renderFeed().catch(fail); }, 250);
  });
  document.getElementById('add').onclick = addSheet;
  document.getElementById('add2').onclick = addSheet;

  let changedTimer = null;
  assi.on('spending.changed', event => {
    if (document.querySelector('.sheet')) return;
    const ratesChanged = event && (event.type === 'currency' || event.type === 'rates');
    if (saving || Object.keys(pending).length) {
      if (ratesChanged) deferredRatesRefresh = true;
      return;
    }
    clearTimeout(changedTimer);
    changedTimer = setTimeout(() => {
      if (ratesChanged && state.tab === 'settings') refreshCurrencyStatus().catch(fail);
      else render();
    }, 400);
  });
  window.addEventListener('resize', () => { if (state.tab === 'overview') render(); });

  ui.icons(document.body);
  if (params.get('tx')) openTx(isNaN(Number(params.get('tx'))) ? params.get('tx') : Number(params.get('tx')));
</script>
