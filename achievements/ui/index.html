<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ачивки</title>
<link rel="stylesheet" href="/ui/kit/kit.css">
<style>
  .page.wide {
    max-width: 980px;
  }

  .chips .chip {
    min-height: 44px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 10px;
  }

  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 10px 6px 12px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    text-align: center;
  }

  .cell.on {
    border-color: var(--accent);
  }

  .cell .badge {
    width: 72px;
    height: 72px;
  }

  .cell .name {
    font-size: 13px;
    line-height: 1.25;
    display: -webkit-box;
    overflow-wrap: anywhere;
  }

  .cell.open .name,
  .cell.masked .name {
    color: var(--ink-2);
  }

  .bar {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }

  .bar > i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
  }

  .cell .bar {
    width: 70%;
    height: 4px;
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .detail {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  .detail .badge {
    width: 150px;
    height: 150px;
  }

  .detail .meta {
    color: var(--ink-2);
    font-size: 13px;
  }

  .detail .tiers {
    width: 100%;
    text-align: left;
  }

  .detail .tiers > div {
    min-height: 44px;
  }

  .flavor {
    font-style: italic;
    color: var(--ink-2);
  }

  .near .small {
    color: var(--ink-2);
  }

  .near .bar {
    margin-top: 6px;
  }

  .reveal {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    animation: fade .2s;
  }

  .reveal .box {
    position: relative;
    width: min(360px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 24px 18px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    text-align: center;
  }

  .reveal .badge {
    width: 168px;
    height: 168px;
    animation: pop .7s cubic-bezier(.2, .9, .3, 1.2) both;
  }

  .reveal .bits {
    position: absolute;
    left: 50%;
    top: 108px;
    width: 0;
    height: 0;
    pointer-events: none;
  }

  .reveal .bit {
    position: absolute;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    background: var(--tone);
    opacity: 0;
    animation: fly 1.1s ease-out .15s forwards;
  }

  .reveal .bit.round {
    border-radius: 50%;
  }

  .reveal .bit.tri {
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }

  .reveal .actions {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .reveal .actions > * {
    flex: 1;
  }

  @keyframes pop {
    from {
      transform: scale(.4);
      opacity: 0;
    }
  }

  @keyframes fly {
    0% {
      opacity: 1;
      transform: translate(0, 0) rotate(0);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx), var(--dy)) rotate(var(--turn));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal .badge {
      animation: none;
    }

    .reveal .bits {
      display: none;
    }
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    align-items: end;
  }

  .switch-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 4px 0;
  }

  .sheet h2 {
    margin-top: 10px;
  }

  @media (min-width: 700px) {
    .layout {
      grid-template-columns: minmax(0, 1fr) 300px;
    }

    .side {
      position: sticky;
      top: 12px;
    }
  }

  @media (max-width: 699px) {
    .side .detail-card {
      display: none;
    }
  }
</style>
<body>
<main class="page wide">
  <header class="topbar">
    <button class="icon-btn" onclick="assi.back()" aria-label="Назад" data-icon="back"></button>
    <h1>Ачивки</h1>
    <button class="icon-btn" id="open-settings" aria-label="Настройки" data-icon="settings"></button>
  </header>

  <section class="section">
    <p id="summary" class="muted">Считаю…</p>
    <p id="note" class="small muted" hidden></p>
    <nav class="chips" id="groups"></nav>
  </section>

  <div class="layout">
    <section class="grid" id="grid"></section>
    <aside class="side">
      <div class="card detail-card"><div class="detail" id="detail"><p class="muted small">Выберите значок, чтобы увидеть условие и прогресс.</p></div></div>
      <section class="section">
        <h2>Ближе всего</h2>
        <div class="list near" id="closest"></div>
      </section>
    </aside>
  </div>
</main>
<script src="/ui/kit/kit.js"></script>
<script src="badge.js"></script>
<script>
  const h = ui.h;
  const MAIN = 'modules/achievements/main.js';
  const call = (fn, ...args) => assi.call(MAIN, fn, ...args);
  const wide = window.matchMedia('(min-width: 700px)');
  let view = null;
  let group = 'Все';
  let selected = null;
  try { group = localStorage.getItem('achievements.group') || 'Все'; } catch (error) { /* private mode */ }

  function date(ms) {
    return new Date(ms).toLocaleDateString(window.__lang || 'ru', { day: 'numeric', month: 'long', year: new Date(ms).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }

  function badge(item, size, rarity) {
    const holder = document.createElement('span');
    holder.innerHTML = Badge.svg(item, { size, rarity });
    return holder.firstChild;
  }

  function bar(ratio) {
    return h('div', { class: 'bar' }, h('i', { style: 'width: ' + Math.round(Math.max(0, Math.min(1, ratio)) * 100) + '%' }));
  }

  function rarityLine(tier) {
    return ui.t('Редкость: {}', ui.t(Badge.rarity(tier.rarity))) + (tier.xp ? ' · ' + ui.t('+{} опыта', tier.xp) : '');
  }

  function detail(item) {
    const out = [badge(item, 150)];
    out.push(h('h3', { 'data-raw': '' }, item.title));
    if (item.masked) {
      out.push(h('p', { class: 'muted' }, 'Условие откроется, когда ачивка будет получена.'));
      if (item.text) out.push(h('p', { class: 'small muted', 'data-raw': '' }, item.text));
      return out;
    }
    const current = item.tiers[Math.min(item.gotCount, item.tiers.length - 1)];
    out.push(h('p', { class: 'meta' }, ui.raw(item.group + ' · '), rarityLine(current), item.tease ? ' · ' + ui.t('колкая') : ''));
    out.push(h('p', { 'data-raw': '' }, item.text));
    if (item.lastAt) {
      out.push(h('p', { class: 'small' }, item.lastRetro ? ui.t('Получено за прошлое: {}', date(item.lastAt)) : ui.t('Получено {}', date(item.lastAt))));
    }
    if (!item.done) {
      out.push(bar(item.ratio));
      out.push(h('p', { class: 'small muted' }, ui.raw(item.progressText)));
    }
    if (item.tiers.length > 1) {
      out.push(h('div', { class: 'list tiers' }, item.tiers.map(tier => h('div', {},
        h('div', { class: 'grow' },
          h('div', { 'data-raw': '' }, tier.title),
          h('div', { class: 'small muted' }, ui.t('нужно {}', String(tier.need).replace('.', ',')), tier.xp ? ' · ' + ui.t('+{} опыта', tier.xp) : '')),
        tier.got ? h('span', { class: 'badge' }, date(tier.got.at)) : null))));
    }
    if (item.flavor) out.push(h('p', { class: 'flavor' }, ui.raw(item.flavor)));
    return out;
  }

  function choose(item) {
    selected = item.id;
    document.querySelectorAll('.cell').forEach(cell => cell.classList.toggle('on', cell.dataset.id === item.id));
    if (wide.matches) {
      document.getElementById('detail').replaceChildren(...detail(item));
    } else {
      const close = ui.sheet([h('div', { class: 'detail' }, detail(item)), h('button', { class: 'btn wide', onclick: () => close() }, 'Закрыть')]);
    }
  }

  function renderGroups() {
    const box = document.getElementById('groups');
    const names = ['Все'].concat(view.groups);
    if (names.indexOf(group) < 0) group = 'Все';
    box.replaceChildren(...names.map(name => h('button', {
      class: 'chip' + (name === group ? ' on' : ''),
      onclick: () => {
        group = name;
        try { localStorage.setItem('achievements.group', name); } catch (error) { /* private mode */ }
        renderGroups();
        renderGrid();
      }
    }, name === 'Все' ? name : ui.raw(name))));
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const items = view.items.filter(item => group === 'Все' || item.group === group)
      .sort((a, b) => (b.gotCount > 0) - (a.gotCount > 0) || (a.masked - b.masked) || b.ratio - a.ratio);
    if (!items.length) {
      grid.replaceChildren(h('div', { class: 'empty' }, 'Здесь пока пусто. Попросите в чате: «сделай ачивку за 10 тренировок в месяц».'));
      return;
    }
    grid.replaceChildren(...items.map(item => h('button', {
      class: 'cell' + (item.gotCount ? ' got' : item.masked ? ' masked' : ' open') + (item.id === selected ? ' on' : ''),
      'data-id': item.id,
      onclick: () => choose(item)
    },
    badge(item, 72),
    h('span', { class: 'name', 'data-raw': '' }, item.title),
    !item.done && !item.masked && item.ratio > 0 ? bar(item.ratio) : null)));
  }

  function renderClosest() {
    const box = document.getElementById('closest');
    const near = view.closest.map(id => view.items.find(item => item.id === id)).filter(Boolean);
    if (!near.length) {
      box.replaceChildren(h('div', { class: 'empty' }, 'Пока ни одна не начата — данные копятся.'));
      return;
    }
    box.replaceChildren(...near.map(item => h('button', { onclick: () => choose(item) },
      badge(item, 40),
      h('div', { class: 'grow' },
        h('div', { 'data-raw': '' }, item.title),
        h('div', { class: 'small' }, ui.raw(item.progressText)),
        bar(item.ratio)))));
  }

  function renderSummary() {
    document.getElementById('summary').textContent = ui.t('Получено {} из {}', view.got, view.total) +
      (view.hiddenLeft ? ' · ' + ui.t('скрытых {}', view.hiddenLeft) : '');
    const notes = [];
    if (view.source === 'base') notes.push(ui.t('Модуль «Здоровье» не установлен: ачивки считаются по записям общей базы — сон, шаги и экран есть, только если их туда записали.'));
    if (!view.lastChecked) notes.push(ui.t('Первая проверка по истории ещё идёт.'));
    if (view.errors && view.errors.length) notes.push(ui.t('Не проверились: {}', view.errors.length));
    const note = document.getElementById('note');
    note.hidden = !notes.length;
    note.textContent = notes.join(' ');
  }

  // ---- the reveal of a new achievement -------------------------------------------------------

  function particles(tone) {
    const box = h('div', { class: 'bits' });
    const shapes = ['', 'round', 'tri'];
    for (let i = 0; i < 16; i++) {
      const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.3;
      const reach = 90 + Math.random() * 70;
      const bit = h('i', { class: 'bit ' + shapes[i % 3] });
      bit.style.setProperty('--dx', Math.round(Math.cos(angle) * reach) + 'px');
      bit.style.setProperty('--dy', Math.round(Math.sin(angle) * reach) + 'px');
      bit.style.setProperty('--turn', Math.round(Math.random() * 360) + 'deg');
      bit.style.setProperty('--tone', tone);
      box.appendChild(bit);
    }
    return box;
  }

  function reveal(queue) {
    if (!queue.length) {
      call('seen').catch(() => {});
      return;
    }
    const { item, tier } = queue.shift();
    const shown = Object.assign({}, item, { gotCount: tier + 1 });
    const t = item.tiers[tier];
    const back = h('div', { class: 'reveal' });
    const done = () => { back.remove(); reveal(queue); };
    back.appendChild(h('div', { class: 'box' },
      particles(Badge.palette(item.group)[1]),
      badge(shown, 168, t.rarity),
      h('h2', {}, t.got && t.got.retro ? 'Получено за прошлое' : 'Получено'),
      h('h3', { 'data-raw': '' }, t.title),
      h('p', { class: 'muted', 'data-raw': '' }, item.text),
      h('p', { class: 'small muted' }, rarityLine(t), t.got && t.got.retro ? ' · ' + date(t.got.at) : ''),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', onclick: () => { back.remove(); call('seen').catch(() => {}); } }, 'Закрыть все'),
        h('button', { class: 'btn primary', onclick: done }, queue.length ? 'Дальше' : 'Хорошо'))));
    document.body.appendChild(back);
  }

  // ---- settings ------------------------------------------------------------------------------

  function select(value, options) {
    const node = h('select', { class: 'input' }, options.map(([id, title]) => h('option', { value: id }, title)));
    node.value = value;
    return node;
  }

  function settings() {
    const s = view.settings;
    const tease = h('input', { type: 'checkbox', class: 'switch', checked: s.tease });
    const retro = h('input', { type: 'checkbox', class: 'switch', checked: s.retro });
    const flavor = h('input', { type: 'checkbox', class: 'switch', checked: s.flavor });
    const notify = select(s.notify, [['all', 'Все'], ['visible', 'Только не скрытые'], ['none', 'Никакие']]);
    const hints = select(s.hints, [['none', 'Нет'], ['group', 'Группа'], ['letter', 'Первая буква']]);
    const pause = select(s.pause, [['skip', 'Пропускать'], ['break', 'Рвать серию']]);
    const games = select(s.gamesRarity, ['common', 'uncommon', 'rare', 'epic', 'legendary'].map(r => [r, Badge.rarity(r)]));
    const checkAt = h('input', { class: 'input', type: 'time', value: s.checkAt });
    const history = h('input', { class: 'input', type: 'number', inputMode: 'numeric', min: 14, max: 365, value: s.historyDays });
    const cardDays = h('input', { class: 'input', type: 'number', inputMode: 'numeric', min: 1, max: 60, value: s.cardDays });
    const cardBadges = h('input', { class: 'input', type: 'number', inputMode: 'numeric', min: 0, max: 12, value: s.cardBadges });
    const xp = {};
    const xpFields = ['common', 'uncommon', 'rare', 'epic', 'legendary'].map(r => {
      xp[r] = h('input', { class: 'input', type: 'number', inputMode: 'numeric', min: 0, value: s.xp[r] });
      return h('label', { class: 'field' }, h('span', {}, Badge.rarity(r)), xp[r]);
    });
    const row = (input, title, hint) => h('label', { class: 'switch-row' }, h('div', { class: 'grow' }, h('div', {}, title), hint ? h('div', { class: 'small muted' }, hint) : null), input);
    let close = null;
    close = ui.sheet([
      h('h3', {}, 'Настройки ачивок'),
      row(tease, 'Колкие ачивки', 'Шутки над собой: приходят тихо, без опыта'),
      row(retro, 'Засчитывать прошлое', 'Новая ачивка проверяется и по прошлым дням'),
      row(flavor, 'Шутливые подписи', 'Раз в неделю от модели «Ачивки: подписи»'),
      h('label', { class: 'field' }, h('span', {}, 'Уведомлять о получении'), notify),
      h('label', { class: 'field' }, h('span', {}, 'Намёк у скрытых'), hints),
      h('label', { class: 'field' }, h('span', {}, 'Дни паузы в сериях'), pause),
      h('h2', {}, 'Опыт по редкости'),
      h('div', { class: 'settings-grid' }, xpFields),
      h('label', { class: 'field' }, h('span', {}, 'Ачивки из игр — какой редкости'), games),
      h('label', { class: 'field' }, h('span', {}, 'Запасная проверка (если «Здоровье» не позвало)'), checkAt),
      h('label', { class: 'field' }, h('span', {}, 'Сколько дней истории смотреть'), history),
      h('h2', {}, 'Карточка на главном экране'),
      h('label', { class: 'field' }, h('span', {}, 'Дней в графике полученных'), cardDays),
      h('label', { class: 'field' }, h('span', {}, 'Последних значков (сколько влезет)'), cardBadges),
      h('button', { class: 'btn soft wide', onclick: async () => {
        ui.toast('Проверяю по истории…');
        try {
          const done = await call('check', null);
          ui.toast(done.granted.length ? ui.t('Новых ачивок: {}', done.granted.length) : 'Новых ачивок нет');
          close();
          load();
        } catch (error) {
          ui.toast(error.message);
        }
      } }, 'Проверить сейчас'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', onclick: () => close() }, 'Отмена'),
        h('button', { class: 'btn primary', onclick: async () => {
          const xpValues = {};
          Object.keys(xp).forEach(r => { xpValues[r] = Math.max(0, parseInt(xp[r].value, 10) || 0); });
          try {
            await call('saveSettings', {
              tease: tease.checked, retro: retro.checked, flavor: flavor.checked, notify: notify.value, hints: hints.value,
              pause: pause.value, gamesRarity: games.value, checkAt: checkAt.value || s.checkAt,
              historyDays: Math.max(14, Math.min(365, parseInt(history.value, 10) || s.historyDays)), xp: xpValues,
              cardDays: Math.max(1, Math.min(60, parseInt(cardDays.value, 10) || s.cardDays)),
              cardBadges: Math.max(0, Math.min(12, parseInt(cardBadges.value, 10) || 0))
            });
            close();
            load();
          } catch (error) {
            ui.toast(error.message);
          }
        } }, 'Сохранить'))
    ]);
  }

  async function load() {
    try {
      view = await call('view');
    } catch (error) {
      document.getElementById('summary').textContent = ui.t('Не удалось прочитать ачивки: {}', error.message);
      return;
    }
    renderSummary();
    renderGroups();
    renderGrid();
    renderClosest();
    const current = view.items.find(item => item.id === selected) || view.items.find(item => item.gotCount) || view.items[0];
    if (current && wide.matches) {
      selected = current.id;
      document.getElementById('detail').replaceChildren(...detail(current));
      renderGrid();
    }
    const fresh = [];
    view.items.forEach(item => item.unseen.forEach(tier => fresh.push({ item, tier })));
    fresh.sort((a, b) => (b.item.tiers[b.tier].got || {}).at - (a.item.tiers[a.tier].got || {}).at);
    if (fresh.length && !document.querySelector('.reveal')) reveal(fresh.slice(0, 5));
    else if (fresh.length) call('seen').catch(() => {});
  }

  document.getElementById('open-settings').onclick = () => view && settings();
  wide.addEventListener('change', () => view && load());
  assi.on('achievements.changed', load);
  load();
</script>
</body>
</html>
